input:
  aprs_is:
    address: "rotate.aprs2.net:14580"
    callsign: "N0CALL"
    passcode: "-1"
    # Filter by range only - APRS-IS doesn't properly AND t/w and r/ filters together
    # Weather filtering is done client-side in the pipeline below
    filter: "r/46.82/-71.25/200"

pipeline:
  processors:
    # Filter for weather packets (must have Wx data with temp or pressure)
    - mapping: |
        if this.Wx == null || (this.Wx.Temp == null && this.Wx.Pressure == null) {
          root = deleted()
        } else {
          root.source = this.SrcCallsign
          root.latitude = this.Latitude
          root.longitude = this.Longitude
          root.pressure = this.Wx.Pressure
          root.temp = this.Wx.Temp
        }

output:
  switch:
    cases:
      # Route errors to stderr
      - check: '@aprs_error != null'
        output:
          stdout:
            codec: lines
      
      # Route valid, mapped data elsewhere (e.g. standard out or a database)
      - output:
          stdout:
            codec: lines